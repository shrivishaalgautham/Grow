name: Docker Publish

on:
  push:
    branches: [main]
    paths:
      - "watchlist/backend/**"
      - "ui/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch: {}

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: watchlist/backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/smart-market-watchlist-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/smart-market-watchlist-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ui
          push: true
          build-args: |
            NEXT_PUBLIC_API_MODE=${{ vars.NEXT_PUBLIC_API_MODE || 'fixture' }}
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL || 'http://localhost:8000' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/smart-market-watchlist-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/smart-market-watchlist-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
