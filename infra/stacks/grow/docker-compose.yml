services:
  backend:
    image: ${DOCKERHUB_USER}/smart-market-watchlist-backend:${BACKEND_IMAGE_TAG}
    container_name: grow-backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODELS: ${OPENROUTER_MODELS}
      LLM_GLOBAL_DAILY_CAP: ${LLM_GLOBAL_DAILY_CAP}
      YAHOO_RPS: ${YAHOO_RPS}
      BSE_ENABLED: ${BSE_ENABLED}
      REFRESH_HOT_SECONDS: ${REFRESH_HOT_SECONDS}
      SCHEDULER_MARKET_HOURS_ONLY: ${SCHEDULER_MARKET_HOURS_ONLY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      DEBUG: ${DEBUG}
      APP_BASE_URL: ${APP_BASE_URL}
      API_BASE_URL: ${API_BASE_URL}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT}
      EMAIL_FROM: ${EMAIL_FROM}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      NOTIFY_INTERVAL_SECONDS: ${NOTIFY_INTERVAL_SECONDS}
      NOTIFY_MIN_GAP_SECONDS: ${NOTIFY_MIN_GAP_SECONDS}
      GDELT_ENABLED: ${GDELT_ENABLED}
      GOOGLE_NEWS_ENABLED: ${GOOGLE_NEWS_ENABLED}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI}
    networks:
      data: {}
      edge:
        aliases:
          - grow-backend
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2).status==200 else 1)"]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  ui:
    image: ${DOCKERHUB_USER}/smart-market-watchlist-frontend:${UI_IMAGE_TAG}
    container_name: grow-ui
    networks:
      edge:
        aliases:
          - grow-ui
    ports:
      - "127.0.0.1:8011:3000"
    restart: unless-stopped

networks:
  data:
    name: grow-data
    external: true
  edge:
    name: grow-edge
    external: true
