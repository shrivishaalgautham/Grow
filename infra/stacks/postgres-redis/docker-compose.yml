services:
  postgres:
    image: postgres:16-alpine
    container_name: grow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-watchlist}
      POSTGRES_USER: ${POSTGRES_USER:-watchlist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-watchlist} -d ${POSTGRES_DB:-watchlist}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: grow-redis
    volumes:
      - ./data/redis:/data
    command: redis-server --appendonly yes
    networks:
      - data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

networks:
  data:
    name: grow-data
    external: true
